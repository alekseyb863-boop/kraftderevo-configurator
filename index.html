<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Конфигуратор артикулов</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header><h1>Конфигуратор артикулов</h1><span id="status" class="status">загрузка CAD-ядра…</span></header>
  <progress id="progress" max="100" hidden></progress>
  <details id="diag" class="diag" open hidden><summary>Диагностика (отправьте этот текст разработчику)</summary><pre id="diag-text"></pre><button type="button" id="diag-copy" class="secondary">Скопировать</button></details>
  <main>
    <form id="form" autocomplete="off" onsubmit="return false">
      <div id="tiles" class="cats" role="radiogroup" aria-label="Артикул"></div>
      <p id="about" class="about"></p>
      <h2>Параметры</h2>
      <div id="controls"></div>
      <div class="buttons">
        <button type="button" id="dl-png">Скачать PNG</button>
        <button type="button" id="dl-pdf">Скачать PDF</button>
        <button type="button" id="dl-stl">Скачать STL</button>
        <button type="button" id="reset" class="secondary">Сбросить</button>
      </div>
      <ul id="warnings" class="warnings" aria-live="polite"></ul>
      <p id="info" class="info err" role="alert" hidden></p>
      <div id="checks" hidden aria-hidden="true"></div>
    </form>
    <section id="view" aria-label="Чертёж"></section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
